<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourdough Ratio</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --text: #2c2825;
      --muted: #7a726a;
      --accent: #b86b35;
      --border: #e6e0d8;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 360px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 1.2rem;
      margin: 0 0 20px 0;
      text-align: center;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .input-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    .row > div:first-child { flex: 1.2; }
    .row > div:last-child { flex: 1; }
    .results {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      font-size: 1.05rem;
    }
    .result-row span:first-child { color: var(--muted); }
    .result-row span:last-child { font-weight: 700; font-size: 1.25rem; }
    .total {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      color: var(--accent);
    }
    .total span:first-child { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>

<div class="card">
  <h1>Starter Ratio</h1>
  
  <div class="input-group">
    <label for="ratio">Ratio (Starter : Flour : Water)</label>
    <input type="text" id="ratio" value="1:4:4" placeholder="e.g. 1:4:4">
  </div>

  <div class="input-group row">
    <div>
      <label for="anchor">Known Ingredient</label>
      <select id="anchor">
        <option value="0">Starter</option>
        <option value="1">Flour</option>
        <option value="2">Water</option>
      </select>
    </div>
    <div>
      <label for="amount">Grams</label>
      <input type="number" id="amount" value="25" min="0" step="any">
    </div>
  </div>

  <div class="results">
    <div class="result-row">
      <span>Starter</span>
      <span id="out-starter">25g</span>
    </div>
    <div class="result-row">
      <span>Flour</span>
      <span id="out-flour">100g</span>
    </div>
    <div class="result-row">
      <span>Water</span>
      <span id="out-water">100g</span>
    </div>
    <div class="result-row total">
      <span>Total Yield</span>
      <span id="out-total">225g</span>
    </div>
  </div>
</div>

<script>
  const ratioInput = document.getElementById('ratio');
  const anchorSelect = document.getElementById('anchor');
  const amountInput = document.getElementById('amount');

  const outStarter = document.getElementById('out-starter');
  const outFlour = document.getElementById('out-flour');
  const outWater = document.getElementById('out-water');
  const outTotal = document.getElementById('out-total');

  function calculate() {
    // Parse "1:4:4" or "1 : 4 : 4" into [1, 4, 4]
    const parts = ratioInput.value.split(':').map(n => parseFloat(n.trim()));
    const anchorIndex = parseInt(anchorSelect.value, 10);
    const knownAmount = parseFloat(amountInput.value);

    // Validate inputs
    if (parts.length !== 3 || parts.some(isNaN) || parts[anchorIndex] <= 0 || isNaN(knownAmount)) {
      outStarter.textContent = '-';
      outFlour.textContent = '-';
      outWater.textContent = '-';
      outTotal.textContent = '-';
      return;
    }

    const unitWeight = knownAmount / parts[anchorIndex];
    const starter = unitWeight * parts[0];
    const flour = unitWeight * parts[1];
    const water = unitWeight * parts[2];
    const total = starter + flour + water;

    // Format cleanly (removes unnecessary .0 decimals)
    const fmt = (num) => `${Math.round(num * 10) / 10}g`;

    outStarter.textContent = fmt(starter);
    outFlour.textContent = fmt(flour);
    outWater.textContent = fmt(water);
    outTotal.textContent = fmt(total);
  }

  ratioInput.addEventListener('input', calculate);
  anchorSelect.addEventListener('change', calculate);
  amountInput.addEventListener('input', calculate);

  calculate();
</script>

</body>
</html>
